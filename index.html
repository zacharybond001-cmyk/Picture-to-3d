<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture to 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@700&family=Bebas+Neue&family=Graduate&family=Black+Ops+One&family=Permanent+Marker&family=Pacifico&family=Bungee&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1e23">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="vendor/earcut.min.js"></script>
<script src="vendor/clipper.js"></script>
<script src="vendor/fflate.js"></script>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>
<style>
:root{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#2f343c;--text:#e8eaed;--dim:#9aa1ab;--accent:#ff7a1a;--accent2:#ffb27a;--ok:#4cc38a;--warn:#f5b041}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 span{color:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 13px Inter,sans-serif;cursor:pointer}
.tabs button.on{background:var(--accent);color:#1a1006;border-color:var(--accent)}
main{display:grid;grid-template-columns:1fr 360px;height:calc(100% - 53px)}
#viewer{position:relative;min-height:320px;overflow:hidden}
#view{width:100%;height:100%;display:block;touch-action:none}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#drop.empty{pointer-events:auto}
#drop .card{background:rgba(27,30,35,.92);border:2px dashed var(--line);border-radius:14px;padding:26px 30px;text-align:center;max-width:340px}
#drop .card b{display:block;font-size:16px;margin-bottom:6px}
#drop .card p{color:var(--dim);margin:0 0 14px}
#drop:not(.empty) .card{display:none}
#drop.drag .card{border-color:var(--accent)}
.btn{background:var(--accent);color:#1a1006;border:0;border-radius:9px;padding:9px 14px;font:700 14px Inter,sans-serif;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
#hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#hud .pill{background:rgba(18,20,23,.85);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--dim);pointer-events:auto}
#hud .pill b{color:var(--text)}
#thumb{position:absolute;right:10px;top:10px;width:190px;border:1px solid var(--line);border-radius:8px;background:#000;display:none;cursor:crosshair}
#thumb:hover{border-color:var(--accent)}
#tools{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
#orient{position:absolute;left:10px;bottom:10px;display:none;flex-direction:column;gap:6px;background:rgba(27,30,35,.92);border:1px solid var(--line);border-radius:10px;padding:8px;width:206px}
#orient .r{display:flex;gap:5px}
#orient button{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 4px;font:600 12px Inter,sans-serif;cursor:pointer}
#orient button.on{border-color:var(--accent);color:var(--accent2)}
#orient input{width:100%;accent-color:var(--accent)}
#orient .t{font-size:11.5px;color:var(--dim)}
#viewer.picking #view{cursor:crosshair}
#tools button{background:rgba(27,30,35,.9);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:600 12px Inter,sans-serif;cursor:pointer}
#tools button.on{border-color:var(--accent);color:var(--accent2)}
#busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--accent);color:#1a1006;font-weight:700;border-radius:20px;padding:4px 12px;font-size:12px;display:none}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:10px 12px 90px}
details{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--panel2)}
summary{cursor:pointer;padding:9px 11px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--dim)}
details[open] summary::after{content:"–"}
.grp{padding:2px 11px 10px}
.row{display:grid;grid-template-columns:118px 1fr 52px;align-items:center;gap:8px;margin:6px 0}
.row label{color:var(--dim);font-size:12.5px}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.row .val{font-size:12px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.row select,.row input[type=text],.row input[type=number]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font:13px Inter,sans-serif}
.row.check{grid-template-columns:118px 1fr}
#presetBox .row input[type=text],#presetBox select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font:13px Inter,sans-serif;min-width:0}
#viewBanner{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(27,30,35,.95);border:1px solid var(--accent);color:var(--text);border-radius:10px;padding:6px 12px;font-size:12.5px;display:none}
.row input[type=color]{width:100%;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:2px}
.note{color:var(--dim);font-size:12px;margin:4px 0}
#info{font-size:12.5px;color:var(--dim)}
#info .sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #0006;vertical-align:-1px;margin-right:5px}
#info table{width:100%;border-collapse:collapse;margin-top:4px}
#info td{padding:2px 0}
#info .warn{color:var(--warn)}
#export{position:sticky;bottom:-90px;background:var(--panel);padding:10px 0 0;border-top:1px solid var(--line);margin-top:10px}
#export .row{grid-template-columns:70px 1fr}
#export .btn{width:100%;margin-top:6px}
#msg{font-size:12px;color:var(--dim);margin-top:6px;min-height:16px}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:52vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line);padding-bottom:30px}
  #export{position:static}
  #thumb{width:120px}
}
</style>
</head>
<body>
<header>
  <h1>Picture <span>→</span> 3D</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <section id="viewer">
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <canvas id="thumb" title="What the picture became"></canvas>
    <div id="busy">Working…</div>
    <div id="viewBanner">Viewing a model file · pick a mode or load a picture to make a new one</div>
    <div id="tools">
      <button id="bLit" title="Simulate light shining through">Backlit</button>
      <button id="bWire">Wire</button>
      <button id="bOri">Orient</button>
      <button id="bFit">Fit</button>
      <button id="bNew">New picture</button>
    </div>
    <div id="orient">
      <button id="oPick" title="Then tap the face that should sit on the bed">Pick bottom face</button>
      <div class="r"><button data-ax="x">⟲ X 90°</button><button data-ax="y">⟲ Y 90°</button><button data-ax="z">⟲ Z 90°</button></div>
      <div class="t">Spin on bed: <span id="oSpinV">0°</span></div>
      <input type="range" id="oSpin" min="-180" max="180" step="5" value="0">
      <div class="r"><button id="oStand" title="Stand a flat model up on its bottom edge">Stand up</button><button id="oReset">Reset</button></div>
      <div class="t" id="oInfo">Lying flat (as built)</div>
    </div>
    <div id="drop" class="empty"><div class="card">
      <b>Drop a picture here</b>
      <p>Photo, logo or drawing — or open an STL / 3MF to look it over. Everything runs on your device.</p>
      <button class="btn" id="pick">Choose file</button>
      <button class="btn ghost" id="sample">Try a sample</button>
    </div></div>
    <input type="file" id="file" accept="image/*,.stl,.3mf" hidden>
  </section>
  <aside id="panel">
    <details open id="presetBox"><summary>My setups</summary><div class="grp">
      <div class="row check"><label>Setup</label><div style="display:flex;gap:6px"><select id="presetSel" style="flex:1"></select><button class="btn ghost" id="presetDel" style="padding:4px 9px" title="Delete this setup">✕</button></div></div>
      <div class="row check"><label>Save current as</label><div style="display:flex;gap:6px"><input type="text" id="presetName" placeholder="e.g. Team keychain" style="flex:1"><button class="btn ghost" id="presetSave" style="padding:4px 10px">Save</button></div></div>
      <div class="note" id="presetMsg"></div>
    </div></details>
    <div id="controls"></div>
    <details open><summary>Result</summary><div class="grp" id="info">Load a picture to start.</div></details>
    <div id="export">
      <div class="row"><label>Name</label><input type="text" id="fname" value="model"></div>
      <div class="row"><label>Format</label><select id="fmt">
        <option value="3mf">3MF – colored parts (Bambu/Orca/Prusa)</option>
        <option value="stl">STL – one file per part</option>
        <option value="stl1">STL – everything in one file</option>
        <option value="both">3MF + STLs</option></select></div>
      <button class="btn" id="dl" disabled>Download</button>
      <div id="msg"></div>
    </div>
  </aside>
</main>

<!-- ======================================================= ENGINE -->
<script>
"use strict";
const CL = ClipperLib, S = 1000;           // clipper works in integer microns

// ---------- 2D geometry (Clipper paths, integer µm) ----------
const G = {
  path: pts => pts.map(([x, y]) => ({X: Math.round(x * S), Y: Math.round(y * S)})),
  run(a, b, type, fill = CL.PolyFillType.pftNonZero) {
    const c = new CL.Clipper();
    if (a && a.length) c.AddPaths(a, CL.PolyType.ptSubject, true);
    if (b && b.length) c.AddPaths(b, CL.PolyType.ptClip, true);
    const out = new CL.Paths();
    c.Execute(type, out, fill, fill);
    return out;
  },
  union: (a, b) => G.run(a, b, CL.ClipType.ctUnion),
  diff: (a, b) => (b && b.length) ? G.run(a, b, CL.ClipType.ctDifference) : G.run(a, null, CL.ClipType.ctUnion),
  inter: (a, b) => G.run(a, b, CL.ClipType.ctIntersection),
  evenodd: a => G.run(a, null, CL.ClipType.ctUnion, CL.PolyFillType.pftEvenOdd),
  offset(a, d) {
    if (!a.length) return [];
    const co = new CL.ClipperOffset(2, 15);
    co.AddPaths(a, CL.JoinType.jtRound, CL.EndType.etClosedPolygon);
    const out = new CL.Paths();
    co.Execute(out, d * S);
    return out;
  },
  ex(a) {
    const c = new CL.Clipper();
    c.AddPaths(a, CL.PolyType.ptSubject, true);
    const t = new CL.PolyTree();
    c.Execute(CL.ClipType.ctUnion, t, CL.PolyFillType.pftNonZero, CL.PolyFillType.pftNonZero);
    return CL.JS.PolyTreeToExPolygons(t);
  },
  fromEx: exs => exs.flatMap(e => [e.outer, ...e.holes]),
  area: a => a.reduce((s, p) => s + CL.Clipper.Area(p), 0) / (S * S),
  bounds(a) {
    let x0 = 1e18, y0 = 1e18, x1 = -1e18, y1 = -1e18;
    for (const p of a) for (const q of p) { if (q.X < x0) x0 = q.X; if (q.X > x1) x1 = q.X; if (q.Y < y0) y0 = q.Y; if (q.Y > y1) y1 = q.Y; }
    return [x0 / S, y0 / S, x1 / S, y1 / S];
  },
  translate: (a, dx, dy) => a.map(p => p.map(q => ({X: q.X + Math.round(dx * S), Y: q.Y + Math.round(dy * S)}))),
  scale: (a, k, ox = 0, oy = 0) => a.map(p => p.map(q => ({X: Math.round((q.X - ox * S) * k + ox * S), Y: Math.round((q.Y - oy * S) * k + oy * S)}))),
  rect: (x0, y0, x1, y1) => [G.path([[x0, y0], [x1, y0], [x1, y1], [x0, y1]])],
  circle(cx, cy, r, n = 72, rx = r, ry = r) {
    const pts = [];
    for (let i = 0; i < n; i++) { const t = i / n * 2 * Math.PI; pts.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]); }
    return [G.path(pts)];
  },
  fillHoles: a => G.union(G.ex(a).map(e => e.outer)),
  dropSmall(a, minA) {
    const out = [];
    for (const e of G.ex(a)) {
      if (Math.abs(CL.Clipper.Area(e.outer)) / (S * S) < minA) continue;
      out.push(e.outer, ...e.holes.filter(h => Math.abs(CL.Clipper.Area(h)) / (S * S) >= minA));
    }
    return G.union(out);
  },
  topAt(a, x) {  // highest point of region along vertical line x
    const strip = G.inter(a, G.rect(x - 0.05, -1e5, x + 0.05, 1e5));
    return strip.length ? G.bounds(strip)[3] : G.bounds(a)[3];
  },
  pointsOf: a => a.flatMap(p => p.map(q => [q.X / S, q.Y / S])),
};

function shapeGeom(name, w, h, corner) {
  if (name === "rect") return G.rect(0, 0, w, h);
  if (name === "rounded") { const r = corner || Math.min(w, h) * 0.08; return G.offset(G.rect(r, r, w - r, h - r), r); }
  if (name === "circle") return G.circle(w / 2, h / 2, 0, 128, w / 2, h / 2);
  if (name === "hex") { const r = Math.min(w / 2, h / Math.sqrt(3)); const p = []; for (let i = 0; i < 6; i++) { const t = i * Math.PI / 3; p.push([w / 2 + r * Math.cos(t), h / 2 + r * Math.sin(t)]); } return [G.path(p)]; }
  if (name === "heart") {
    const n = 240, xs = [], ys = [];
    for (let i = 0; i < n; i++) { const t = i / n * 2 * Math.PI; xs.push(16 * Math.sin(t) ** 3); ys.push(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); }
    const mnx = Math.min(...xs), mxx = Math.max(...xs), mny = Math.min(...ys), mxy = Math.max(...ys);
    return G.union([G.path(xs.map((x, i) => [(x - mnx) / (mxx - mnx) * w, (ys[i] - mny) / (mxy - mny) * h]))]);
  }
  throw new Error("unknown shape " + name);
}

// keychain loop / hanging hole at the top centre of a region
function addons(shape, P, rim) {
  const [x0, , x1] = G.bounds(shape), cx = (x0 + x1) / 2, yt = G.topAt(shape, cx);
  let add = [], cut = [], solid = [];
  if (P.loop) {
    const rin = P.loopD / 2, ro = rin + 2.2, cy = yt + ro - 1.8;
    add = G.diff(G.circle(cx, cy, ro), G.circle(cx, cy, rin));
    cut = G.circle(cx, cy, rin);
    solid = G.circle(cx, cy, ro + 0.01);
  }
  if (P.hole > 0) {
    const r = P.hole / 2, cy = yt - r - Math.max(rim, 1) - 1.8;
    cut = G.union(cut, G.circle(cx, cy, r));
    solid = G.union(solid, G.circle(cx, cy, r + 1.8));
  }
  return {add, cut, solid};
}

// ---------- mesh ----------
class MB {   // mesh builder
  constructor() { this.p = []; this.i = []; }
  v(x, y, z) { this.p.push(x, y, z); return this.p.length / 3 - 1; }
  t(a, b, c) { this.i.push(a, b, c); }
  q(a, b, c, d) { this.i.push(a, b, c, a, c, d); }
  mesh() { return {pos: new Float32Array(this.p), idx: new Uint32Array(this.i)}; }
}
function meshVolume(m) {
  const P = m.pos, I = m.idx; let v = 0;
  for (let k = 0; k < I.length; k += 3) {
    const a = I[k] * 3, b = I[k + 1] * 3, c = I[k + 2] * 3;
    v += P[a] * (P[b + 1] * P[c + 2] - P[b + 2] * P[c + 1]) - P[a + 1] * (P[b] * P[c + 2] - P[b + 2] * P[c]) + P[a + 2] * (P[b] * P[c + 1] - P[b + 1] * P[c]);
  }
  return v / 6;
}
function fixOrientation(m) {
  if (meshVolume(m) < 0) for (let k = 0; k < m.idx.length; k += 3) { const t = m.idx[k + 1]; m.idx[k + 1] = m.idx[k + 2]; m.idx[k + 2] = t; }
  return m;
}
function concat(ms) {
  ms = ms.filter(m => m && m.idx.length);
  let np = 0, ni = 0; for (const m of ms) { np += m.pos.length; ni += m.idx.length; }
  const pos = new Float32Array(np), idx = new Uint32Array(ni); let op = 0, oi = 0;
  for (const m of ms) { pos.set(m.pos, op); for (let k = 0; k < m.idx.length; k++) idx[oi + k] = m.idx[k] + op / 3; op += m.pos.length; oi += m.idx.length; }
  return {pos, idx};
}
function mergeVerts(m, tol = 1e-4) {
  const map = new Map(), P = m.pos, remap = new Uint32Array(P.length / 3), out = [];
  for (let i = 0; i < P.length / 3; i++) {
    const k = Math.round(P[3 * i] / tol) + "," + Math.round(P[3 * i + 1] / tol) + "," + Math.round(P[3 * i + 2] / tol);
    let j = map.get(k); if (j === undefined) { j = out.length / 3; map.set(k, j); out.push(P[3 * i], P[3 * i + 1], P[3 * i + 2]); }
    remap[i] = j;
  }
  const I = [];
  for (let k = 0; k < m.idx.length; k += 3) {
    const a = remap[m.idx[k]], b = remap[m.idx[k + 1]], c = remap[m.idx[k + 2]];
    if (a !== b && b !== c && a !== c) I.push(a, b, c);
  }
  return {pos: new Float32Array(out), idx: new Uint32Array(I)};
}

// ring cleanup: drop repeated and exactly-collinear points (integer coords => exact test)
function cleanRing(p) {
  let r = p.slice();
  for (let it = 0; it < 6 && r.length >= 3; it++) {
    const keep = [];
    for (let i = 0; i < r.length; i++) {
      const a = r[(i - 1 + r.length) % r.length], b = r[i], c = r[(i + 1) % r.length];
      const cr = (b.X - a.X) * (c.Y - b.Y) - (b.Y - a.Y) * (c.X - b.X);
      if (!(b.X === a.X && b.Y === a.Y) && cr !== 0) keep.push(b);
    }
    if (keep.length === r.length) break;
    r = keep;
  }
  return r;
}
// triangulate an ExPolygon; returns {rings(mm), tris} with every ring vertex used (so walls match)
function triEx(e) {
  let rings = [cleanRing(e.outer), ...e.holes.map(cleanRing)].filter(r => r.length >= 3);
  if (!rings.length || CL.Clipper.Area(rings[0]) === 0) return null;
  if (CL.Clipper.Area(rings[0]) < 0) rings[0] = rings[0].slice().reverse();
  for (let k = 1; k < rings.length; k++) if (CL.Clipper.Area(rings[k]) > 0) rings[k] = rings[k].slice().reverse();
  for (let it = 0; it < 8; it++) {
    const flat = [], holes = [];
    rings.forEach((r, k) => { if (k) holes.push(flat.length / 2); for (const q of r) flat.push(q.X / S, q.Y / S); });
    const tris = earcut(flat, holes, 2), n = flat.length / 2;
    const used = new Uint8Array(n); for (const t of tris) used[t] = 1;
    let all = true; for (let i = 0; i < n; i++) if (!used[i]) { all = false; break; }
    if (all || it === 7) return {flat, tris, ringLen: rings.map(r => r.length)};
    let o = 0;
    rings = rings.map(r => { const k = r.filter((_, i) => used[o + i]); o += r.length; return k; }).filter(r => r.length >= 3);
    if (!rings.length) return null;
  }
}
// earcut keeps one winding for all its triangles; read it from the total signed area
function triSign(flat, tris) {
  let s = 0;
  for (let k = 0; k < tris.length; k += 3) { const a = tris[k], b = tris[k + 1], c = tris[k + 2]; s += (flat[2 * b] - flat[2 * a]) * (flat[2 * c + 1] - flat[2 * a + 1]) - (flat[2 * b + 1] - flat[2 * a + 1]) * (flat[2 * c] - flat[2 * a]); }
  return s;
}
// prism between z0 and z1
function extrude(paths, z0, z1) {
  const mb = new MB();
  for (const e of G.ex(paths)) {
    const T = triEx(e); if (!T) continue;
    const {flat, tris, ringLen} = T, n = flat.length / 2, base = mb.p.length / 3;
    for (let i = 0; i < n; i++) mb.v(flat[2 * i], flat[2 * i + 1], z0);
    for (let i = 0; i < n; i++) mb.v(flat[2 * i], flat[2 * i + 1], z1);
    const flip = triSign(flat, tris) < 0;
    for (let k = 0; k < tris.length; k += 3) {
      let a = tris[k], b = tris[k + 1], c = tris[k + 2];
      if (flip) [b, c] = [c, b];
      mb.t(base + n + a, base + n + b, base + n + c);
      mb.t(base + a, base + c, base + b);
    }
    let s = 0;
    for (const L of ringLen) {
      for (let i = 0; i < L; i++) { const a = base + s + i, b = base + s + (i + 1) % L; mb.q(a, b, b + n, a + n); }
      s += L;
    }
  }
  return mb.mesh();
}

async function layout(P, artList) {

    parts.push({name: "plate", mesh: extrude(G.diff(G.union(plate, ad.add), ad.cut), 0, base), color: P.plateColor});
    if (P.border > 0) {

  else { field = new Float32Array(L.length); for (let i = 0; i < L.length; i++) field[i] = P.invert ? L[i] : 1 - L[i]; t = P.autoThr ? 1 - otsu(L) : P.threshold; }

// ---------- background removal (flood fill from edges and/or tapped spots, no AI) ----------
function removeBackground(img, P) {
  const seeds = P.bgSeeds || [];
  if (P.bgMode === "off" && !seeds.length) return null;
  const {W, H, A} = img, N = W * H, L = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const l = toLab(img.R[i], img.G[i], img.B[i]); L[3 * i] = l[0]; L[3 * i + 1] = l[1]; L[3 * i + 2] = l[2]; }

    let h = 0, t = 0;

    while (h < t) {
      const i = q[h++], r = (i / W) | 0, c = i - r * W;
      if (c > 0 && !rem[i - 1] && near(i - 1, ref)) { rem[i - 1] = 1; q[t++] = i - 1; }
      if (c < W - 1 && !rem[i + 1] && near(i + 1, ref)) { rem[i + 1] = 1; q[t++] = i + 1; }
      if (r > 0 && !rem[i - W] && near(i - W, ref)) { rem[i - W] = 1; q[t++] = i - W; }
      if (r < H - 1 && !rem[i + W] && near(i + W, ref)) { rem[i + W] = 1; q[t++] = i + W; }
    }

    const border = [];
    for (let c = 0; c < W; c++) border.push(c, (H - 1) * W + c);
    for (let r = 1; r < H - 1; r++) border.push(r * W, r * W + W - 1);
    const op = border.filter(i => A[i] >= 0.5);
    if (op.length) {   // reference = median border color
      const med = k => { const v = op.map(i => L[3 * i + k]).sort((a, b) => a - b); return v[v.length >> 1]; };

    for (const i of add) rem[i] = 1;
  }
  let n = 0, sr = 0, sg = 0, sb = 0;
  for (let i = 0; i < N; i++) if (rem[i]) { if (A[i] >= 0.5) { sr += img.R[i]; sg += img.G[i]; sb += img.B[i]; n++; } A[i] = 0; }
  return {removed: n / N, color: n ? rgb2hex([sr / n, sg / n, sb / n]) : null};
}

async function buildModel(src, P) {

  el.value = ps && [...el.options].some(o => o.value === ps) ? ps : "";
}
document.getElementById("presetSel").onchange = e => {
  const k = e.target.value; if (!k) return;
  const s = BUILTIN[k] || store.get("p3d.presets", {})[k]; if (s) { applySetup(s); document.getElementById("presetMsg").textContent = "Loaded “" + k.replace("★ ", "") + "”."; }
};
document.getElementById("presetSave").onclick = () => {
  const name = document.getElementById("presetName").value.trim(); const msgEl = document.getElementById("presetMsg");
  if (!name) { msgEl.textContent = "Type a name first."; return; }
  const mine = store.get("p3d.presets", {}); mine[name] = snapshot();
  msgEl.textContent = store.set("p3d.presets", mine) ? `Saved “${name}”.` : "This browser won't let the app save setups here.";
  document.getElementById("presetName").value = ""; fillPresets(name);
};
document.getElementById("presetDel").onclick = () => {
  const k = document.getElementById("presetSel").value, msgEl = document.getElementById("presetMsg");
  if (!k) return; if (BUILTIN[k]) { msgEl.textContent = "Built-in setups can't be deleted."; return; }
  const mine = store.get("p3d.presets", {}); delete mine[k]; store.set("p3d.presets", mine); fillPresets(""); msgEl.textContent = `Deleted “${k}”.`;
};
fillPresets();
let saveTimer = null;
const rememberLast = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set("p3d.last", snapshot()), 400); };

// ----- open files from the OS (installed app) & offline support
if ("launchQueue" in window) launchQueue.setConsumer(async lp => { for (const h of lp.files || []) { loadFile(await h.getFile()); break; } });
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

// ----- download
let downloads = null;
(async () => { try { if (window.claude?.use) downloads = await window.claude.use("downloads"); } catch (e) {} })();
const msg = t => document.getElementById("msg").textContent = t;
document.getElementById("dl").onclick = async () => {
  const btn = document.getElementById("dl"); btn.disabled = true; msg("Building full-detail model…");
  await new Promise(r => setTimeout(r, 30));
  try {
    const m = VIEWING ? MODEL : oriented(await Engine.buildModel(SRC, params(true))), fmt = document.getElementById("fmt").value;
    const name = (document.getElementById("fname").value || "model").replace(/[^\w-]+/g, "_"), files = {};
    if (fmt === "3mf" || fmt === "both") files[name + ".3mf"] = Engine.threeMF(m.parts);
    if (fmt === "stl" || fmt === "both") m.parts.forEach(p => files[`${name}_${p.name}.stl`] = Engine.stlBytes(p.mesh));
    if (fmt === "stl1") files[name + ".stl"] = Engine.stlBytes(Engine.concat(m.parts.map(p => p.mesh)));
    const zip = fflate.zipSync(files, {level: 6}), fn = name + ".zip";
    if (downloads) {
      try { await downloads.save({filename: fn, data: new Blob([zip])}); msg("Saved " + fn); }
      catch (e) { msg(e.code === "declined" ? "Download cancelled." : "Couldn't save: " + (e.message || e.code)); }
    } else {   // installed app / normal browser: single files download as-is
      const names = Object.keys(files), one = names.length === 1;
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([one ? files[names[0]] : zip])); a.download = one ? names[0] : fn; a.click();
      msg("Downloaded " + (one ? names[0] : fn));
    }
  } catch (e) { console.error(e); msg("Error: " + e.message); }
  btn.disabled = false;
};
{ const last = store.get("p3d.last", null); if (last && last.v) applySetup(last); else setMode("litho"); }
window.__app = {P, setMode, changed, get MODEL() { return MODEL; }, loadSample: () => document.getElementById("sample").click(), setSrc: s => { SRC = s; drop.classList.remove("empty"); changed(true); }};
</script>
